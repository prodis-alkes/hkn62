<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Website Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <title>Rekam Kehadiran dengan Geolocation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- The allow="geolocation" attribute permits the iframe to request location access -->
        <iframe 
            src="https://script.google.com/macros/s/AKfycbz_Vq91TliY5v8HaL3VKURBNzA6ahm3aHIbE-FrRfI1QVW2LsMl47WHzfNuWpokX2YSIg/exec" 
            allow="geolocation"
            title="Google Apps Script App">
        </iframe>
    </div>

</body>
</html>
